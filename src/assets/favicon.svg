<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0f172a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --foreground: #ffffff;
      }
    }
  </style>

  <rect width="24" height="24" rx="4" fill="var(--background)" />

  <g fill="var(--foreground)">
    <circle cx="12" cy="14.5" r="4.2" />
    <circle cx="5" cy="7.5" r="2.1" />
    <circle cx="10.2" cy="4.3" r="2.1" />
    <circle cx="14.8" cy="4.3" r="2.1" />
    <circle cx="19" cy="7.5" r="2.1" />
  </g>
</svg>
