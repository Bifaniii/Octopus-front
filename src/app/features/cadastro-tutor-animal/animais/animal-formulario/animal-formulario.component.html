<form class="form" [formGroup]="form" (ngSubmit)="enviar()">
  <h3 class="form__titulo">{{ titulo }}</h3>

  <label class="campo">
    <span class="campo__rotulo">Nome</span>
    <input type="text" formControlName="nome" maxlength="100" placeholder="Ex.: Thor" />
  </label>

  <div class="linha">
    <label class="campo">
      <span class="campo__rotulo">Espécie</span>
      <select formControlName="especie">
        <option [ngValue]="null" disabled>Escolha</option>
        @for (e of especies; track e) {
          <option [ngValue]="e">{{ e }}</option>
        }
      </select>
    </label>

    <label class="campo">
      <span class="campo__rotulo">Sexo</span>
      <select formControlName="sexo">
        <option [ngValue]="null" disabled>Escolha</option>
        @for (s of sexos; track s.valor) {
          <option [ngValue]="s.valor">{{ s.rotulo }}</option>
        }
      </select>
    </label>
  </div>

  <div class="linha">
    <label class="campo">
      <span class="campo__rotulo">Última antirrábica (opcional)</span>
      <input type="date" formControlName="dataAntirrabica" [max]="hoje" />
    </label>
  </div>

  <label class="campo">
    <span class="campo__rotulo">Mãe (opcional)</span>
    <select formControlName="maeId">
      <option [ngValue]="null">Não informada</option>
      @for (m of maes; track m.id) {
        <option [ngValue]="m.id">{{ m.rotulo }}</option>
      }
    </select>
    <span class="campo__ajuda">
      Só aparecem fêmeas da mesma espécie. Necessária para internar filhotes juntos na baia de ninhada (RN-01).
    </span>
  </label>

  @if (perguntarInternacao) {
    <label class="check">
      <input type="checkbox" formControlName="precisaInternar" />
      <span>Precisa internar?</span>
    </label>
  }

  @if (erro() ?? erroApi; as mensagem) {
    <p class="erro" role="alert">{{ mensagem }}</p>
  }

  <footer class="form__rodape">
    <button type="button" class="botao" [disabled]="salvando" (click)="voltar.emit()">{{ textoVoltar }}</button>
    <span class="espaco"></span>
    <button type="submit" class="botao botao--primario" [disabled]="salvando">
      {{ salvando ? 'Salvando...' : textoBotao }}
    </button>
  </footer>
</form>
