<form class="form" [formGroup]="form" (ngSubmit)="enviar()">
  <h3 class="form__titulo">{{ titulo }}</h3>

  <label class="campo">
    <span class="campo__rotulo">Nome</span>
    <input type="text" formControlName="nome" maxlength="100" placeholder="Nome completo" />
  </label>

  <label class="campo">
    <span class="campo__rotulo">Endereço</span>
    <input type="text" formControlName="endereco" maxlength="255" placeholder="Rua, número, bairro" />
  </label>

  <div class="linha">
    <label class="campo">
      <span class="campo__rotulo">Data de nascimento</span>
      <input type="date" formControlName="dataNascimento" [max]="hoje" />
    </label>

    <label class="campo">
      <span class="campo__rotulo">Telefone</span>
      <input type="tel" formControlName="telefone" maxlength="15" placeholder="(11) 98765-4321" />
    </label>
  </div>

  @if (erro() ?? erroApi; as mensagem) {
    <p class="erro" role="alert">{{ mensagem }}</p>
  }

  <footer class="form__rodape">
    <button type="button" class="botao" [disabled]="salvando" (click)="cancelar.emit()">Cancelar</button>
    <span class="espaco"></span>
    <button type="submit" class="botao botao--primario" [disabled]="salvando">
      {{ salvando ? 'Salvando...' : textoBotao }}
    </button>
  </footer>
</form>
