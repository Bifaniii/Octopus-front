<aside class="marca">
  <div class="marca__nome">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="14.5" r="4.2" />
      <circle cx="5" cy="7.5" r="2.1" />
      <circle cx="10.2" cy="4.3" r="2.1" />
      <circle cx="14.8" cy="4.3" r="2.1" />
      <circle cx="19" cy="7.5" r="2.1" />
    </svg>
    <span>{{ brandName }}</span>
  </div>

  <h1 class="marca__frase">{{ frase }}</h1>

  <figure class="regua">
    <div class="regua__marcas" aria-hidden="true">
      @for (h of horas; track $index) {
        <span class="regua__marca" [class.regua__marca--turno]="rotuladas.has(h) && $index < 24"></span>
      }
    </div>
    <div class="regua__turnos">
      <div class="regua__turno regua__turno--manha"><b>Manhã</b><span>6h às 12h</span></div>
      <div class="regua__turno regua__turno--tarde"><b>Tarde</b><span>12h às 18h</span></div>
      <div class="regua__turno regua__turno--noite"><b>Noite</b><span>18h às 6h</span></div>
    </div>
    <figcaption class="regua__legenda">Turnos do plantão</figcaption>
  </figure>
</aside>
