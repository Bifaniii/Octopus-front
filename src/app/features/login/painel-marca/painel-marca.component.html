<aside class="brand-panel">
  <div class="brand-panel__pattern" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="3">
      <circle cx="100" cy="120" r="34" />
      <circle cx="62" cy="82" r="14" />
      <circle cx="100" cy="66" r="15" />
      <circle cx="138" cy="82" r="14" />
      <circle cx="150" cy="112" r="12" />
    </svg>
  </div>

  <div class="brand-panel__logo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="14.5" r="4.2" />
      <circle cx="5" cy="7.5" r="2.1" />
      <circle cx="10.2" cy="4.3" r="2.1" />
      <circle cx="14.8" cy="4.3" r="2.1" />
      <circle cx="19" cy="7.5" r="2.1" />
    </svg>
    <span>{{ brandName }}</span>
  </div>

  <div class="brand-panel__copy">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>

  <footer class="brand-panel__footer">© 2026 {{ brandName }}</footer>
</aside>
