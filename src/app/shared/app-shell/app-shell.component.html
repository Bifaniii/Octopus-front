<div class="shell" [class.shell--sem-menu]="menuOculto()">
  <aside class="shell__sidebar" id="menu-lateral">
    <div class="shell__marca">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="14.5" r="4.2" />
        <circle cx="5" cy="7.5" r="2.1" />
        <circle cx="10.2" cy="4.3" r="2.1" />
        <circle cx="14.8" cy="4.3" r="2.1" />
        <circle cx="19" cy="7.5" r="2.1" />
      </svg>
      <span>Plantão VidaPet</span>
    </div>

    <nav class="shell__nav" aria-label="Principal">
      <div class="shell__grupo">
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'painel-doses'" routerLink="/painel-doses"
           [attr.aria-current]="itemAtivo === 'painel-doses' ? 'page' : null">
          <i class="bi bi-alarm" aria-hidden="true"></i><span>Painel de doses</span>
        </a>
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'internacao'" routerLink="/internacao"
           [attr.aria-current]="itemAtivo === 'internacao' ? 'page' : null">
          <i class="bi bi-hospital" aria-hidden="true"></i><span>Internação</span>
        </a>
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'prontuarios'" routerLink="/prescricoes"
           [attr.aria-current]="itemAtivo === 'prontuarios' ? 'page' : null">
          <i class="bi bi-clipboard2-pulse" aria-hidden="true"></i><span>Prescrições</span>
        </a>
      </div>

      <div class="shell__grupo">
        @if (veTutores()) {
          <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'tutores'" routerLink="/cadastro-tutor-animal"
             [attr.aria-current]="itemAtivo === 'tutores' ? 'page' : null">
            <i class="bi bi-people" aria-hidden="true"></i><span>Tutores e animais</span>
          </a>
        }
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'baias'" routerLink="/baias"
           [attr.aria-current]="itemAtivo === 'baias' ? 'page' : null">
          <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i><span>Baias</span>
        </a>
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'medicamentos'" routerLink="/registro-medicamentos"
           [attr.aria-current]="itemAtivo === 'medicamentos' ? 'page' : null">
          <i class="bi bi-capsule" aria-hidden="true"></i><span>Medicamentos</span>
        </a>
      </div>

      <div class="shell__grupo">
        <a class="shell__item" [class.shell__item--ativo]="itemAtivo === 'relatorios'" routerLink="/relatorios"
           [attr.aria-current]="itemAtivo === 'relatorios' ? 'page' : null">
          <i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i><span>Relatórios</span>
        </a>
      </div>
    </nav>

    <div class="shell__usuario">
      <div class="shell__quem">
        <span class="shell__email" [attr.title]="email()">{{ email() }}</span>
        <span class="shell__perfil">{{ perfil() }}</span>
      </div>
      <div class="shell__rodape-acoes">
        <app-modo-dark />
        <button type="button" class="shell__sair" (click)="fazerLogout()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="shell__main">
    <header class="shell__header">
      <button
        type="button"
        class="shell__menu-botao"
        (click)="alternarMenu()"
        [attr.aria-expanded]="!menuOculto()"
        aria-controls="menu-lateral"
        [attr.aria-label]="menuOculto() ? 'Mostrar o menu lateral' : 'Ocultar o menu lateral'"
        [attr.title]="menuOculto() ? 'Mostrar o menu' : 'Ocultar o menu'"
      >
        <i class="bi" [class.bi-layout-sidebar]="!menuOculto()" [class.bi-layout-sidebar-inset]="menuOculto()" aria-hidden="true"></i>
      </button>
      <div class="shell__titulo">
        <h1>{{ titulo }}</h1>
        @if (subtitulo) {
          <p>{{ subtitulo }}</p>
        }
      </div>
    </header>

    <main class="shell__conteudo">
      <ng-content />
    </main>
  </div>
</div>
